<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学迎新破冰：交友 Bingo 挑战赛</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f8fafc; min-height: 100vh; padding: 32px 16px; color: #1e293b; }
        .max-w { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 24px; }
        h1 { font-size: 28px; font-weight: bold; color: #4f46e5; margin-bottom: 8px; }
        p { font-size: 14px; color: #64748b; line-height: 1.5; }
        .banner { display: inline-block; margin-top: 16px; background-color: #eef2ff; border: 1px solid #c7d2fe; color: #4338ca; padding: 8px 16px; border-radius: 9999px; font-size: 14px; font-weight: 600; }
        .card { background: white; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-radius: 16px; padding: 20px; overflow-x: auto; }
        .grid { display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr)); gap: 10px; min-width: 700px; }
        .cell { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; min-height: 110px; cursor: pointer; transition: all 0.2s; user-select: none; }
        .cell:hover { border-color: #818cf8; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .cell.checked { background-color: #eef2ff; border-color: #a5b4fc; }
        .cell-num { font-size: 10px; font-weight: bold; color: #94a3b8; margin-bottom: 4px; }
        .cell-text { font-size: 12px; font-weight: 600; color: #334155; }
        .cell-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f1f5f9; }
        .cell-signer { font-size: 11px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #94a3b8; font-style: italic; }
        .cell-signer.active { color: #4f46e5; font-weight: bold; font-style: normal; }
        .checkbox { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 1px solid #cbd5e1; }
        .cell.checked .checkbox { background-color: #4f46e5; color: white; border-color: #4f46e5; }
        .btns { margin-top: 24px; display: flex; justify-content: center; gap: 16px; }
        .btn { padding: 10px 20px; border-radius: 12px; font-weight: 500; font-size: 14px; cursor: pointer; border: none; transition: 0.2s; }
        .btn-reset { background-color: #e2e8f0; color: #334155; }
        .btn-reset:hover { background-color: #cbd5e1; }
        .btn-check { background-color: #4f46e5; color: white; box-shadow: 0 4px 6px -1px rgba(79,70,229,0.3); }
        .btn-check:hover { background-color: #4338ca; }
        /* Modals */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
        .modal.show { display: flex; }
        .modal-box { background: white; border-radius: 20px; padding: 24px; max-width: 360px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-box h3 { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
        .modal-box p { font-size: 12px; color: #64748b; margin-bottom: 16px; }
        .modal-input { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; outline: none; }
        .modal-input:focus { border-color: #4f46e5; ring: 2px solid #4f46e5; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .modal-btn { padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; }
        .modal-btn-cancel { background: #f1f5f9; color: #475569; }
        .modal-btn-confirm { background: #4f46e5; color: white; }
    </style>
</head>
<body>
    <div class="max-w">
        <header>
            <h1>🎓 大学迎新破冰：交友 Bingo</h1>
            <p>点击任意格子输入新朋友的签名并打勾！横、竖、斜任意连成 <b>1 条直线</b> 即可触发 BINGO！</p>
            <div id="status-banner" class="banner">当前进度：已完成 0 个格子 | 尚未连线</div>
        </header>

        <div class="card">
            <div class="grid" id="bingo-grid"></div>
        </div>

        <div class="btns">
            <button class="btn btn-reset" onclick="resetBoard()">清空重置</button>
            <button class="btn btn-check" onclick="checkBingo()">手动检查连线</button>
        </div>
    </div>

    <div id="name-modal" class="modal">
        <div class="modal-box">
            <h3 id="modal-title">填写签名</h3>
            <p id="modal-desc"></p>
            <input type="text" id="signer-name" class="modal-input" placeholder="请输入同学的名字...">
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" onclick="saveSigner()">确认</button>
            </div>
        </div>
    </div>

    <div id="bingo-modal" class="modal">
        <div class="modal-box" style="text-align: center;">
            <div style="font-size: 40px; margin-bottom: 8px;">🎉</div>
            <h3 style="color: #4f46e5; font-size: 22px;">BINGO 成功！</h3>
            <p style="margin-bottom: 20px;">太棒了！你已经成功连成一线，快去找主持人验证领奖吧！</p>
            <button class="btn btn-check" style="width: 100%;" onclick="closeBingoModal()">继续游戏</button>
        </div>
    </div>

    <script>
        const bingoTasks = [
            "名字是 A 开头的", "是独生子女", "家里养了猫或狗", "假期喜欢宅在家不出门", "夜猫子",
            "Perlis 本地人", "超级擅长随时随地睡觉", "至少去过 3 个不同的国家", "咖啡因重度依赖者", "喜欢看悬疑/科幻电影",
            "正在学习一门新语言", "会弹某种乐器", "能唱出 KMP 校歌的人", "拥有驾照但不敢上路", "宿舍里常备零食",
            "拥有一个冷门的小众收藏", "能背出圆周率小数点后 10 位", "喜欢早起的人", "擅长打游戏", "喜欢户外徒步或露营",
            "手机相册有 1W+ 张照片", "讨厌吃香菜", "拥有某种隐藏特长", "国庆月生日的人", "随身带着耳机走哪听哪"
        ];

        let boardState = Array(25).fill({ checked: false, name: '' });
        let activeIndex = null;

        const gridEl = document.getElementById('bingo-grid');
        const modalEl = document.getElementById('name-modal');
        const bingoModalEl = document.getElementById('bingo-modal');
        const signerInput = document.getElementById('signer-name');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const statusBanner = document.getElementById('status-banner');

        function renderBoard() {
            gridEl.innerHTML = '';
            let completedCount = 0;

            bingoTasks.forEach((task, index) => {
                const cellData = boardState[index];
                if (cellData.checked) completedCount++;

                const cell = document.createElement('div');
                cell.className = `cell ${cellData.checked ? 'checked' : ''}`;
                
                cell.innerHTML = `
                    <div>
                        <div class="cell-num">#${index + 1}</div>
                        <div class="cell-text">${task}</div>
                    </div>
                    <div class="cell-footer">
                        <span class="cell-signer ${cellData.name ? 'active' : ''}">
                            ${cellData.name ? '签名: ' + cellData.name : '点击填写签名'}
                        </span>
                        <div class="checkbox">${cellData.checked ? '✓' : ''}</div>
                    </div>
                `;

                cell.onclick = () => openModal(index);
                gridEl.appendChild(cell);
            });

            const hasBingo = checkWinningLines(false);
            statusBanner.innerHTML = `当前进度：已完成 <b>${completedCount}</b> / 25 个格子 | ${hasBingo ? '<span style="color: #059669; font-weight: bold;">🎉 已达成 BINGO！</span>' : '尚未连线'}`;
        }

        function openModal(index) {
            activeIndex = index;
            modalTitle.innerText = `格子 #${index + 1}`;
            modalDesc.innerText = bingoTasks[index];
            signerInput.value = boardState[index].name || '';
            modalEl.classList.add('show');
            signerInput.focus();
        }

        function closeModal() {
            modalEl.classList.remove('show');
            activeIndex = null;
        }

        function saveSigner() {
            if (activeIndex === null) return;
            const name = signerInput.value.trim();
            boardState[activeIndex] = {
                checked: name.length > 0,
                name: name
            };
            closeModal();
            renderBoard();
        }

        function resetBoard() {
            boardState = Array(25).fill({ checked: false, name: '' });
            renderBoard();
        }

        function checkWinningLines(showAlert = true) {
            const matrix = [];
            for (let i = 0; i < 5; i++) {
                matrix.push(boardState.slice(i * 5, i * 5 + 5).map(c => c.checked));
            }

            let lines = 0;
            for (let i = 0; i < 5; i++) {
                if (matrix[i].every(val => val)) lines++;
            }
            for (let j = 0; j < 5; j++) {
                if ([0,1,2,3,4].every(i => matrix[i][j])) lines++;
            }
            if ([0,1,2,3,4].every(i => matrix[i][i])) lines++;
            if ([0,1,2,3,4].every(i => matrix[i][4 - i])) lines++;

            if (showAlert) {
                if (lines > 0) {
                    bingoModalEl.classList.add('show');
                } else {
                    alert("目前还没有连线哦，加油继续找新朋友签名吧！");
                }
            }
            return lines > 0;
        }

        function checkBingo() {
            checkWinningLines(true);
        }

        function closeBingoModal() {
            bingoModalEl.classList.remove('show');
        }

        renderBoard();
    </script>
</body>
</html>
